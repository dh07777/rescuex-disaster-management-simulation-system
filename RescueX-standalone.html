<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RescueX – Disaster Management Simulation</title><style>:root{--bg:#0a1628;--bg2:#0f2038;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--tx:#e6edf7;--mu:#8fa3bf;--red:#e5392b;--or:#ff8a1f;--ok:#2fb86b}

*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,sans-serif;background:radial-gradient(circle at 20% 0,var(--bg2),var(--bg));color:var(--tx);min-height:100vh;display:flex}

.logo{display:flex;gap:8px;align-items:center;font-size:20px;margin-bottom:14px}.logo span{color:var(--red)}

#main{margin-left:230px;flex:1;min-width:0}header{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg2);z-index:10}
header h1{font-size:18px;margin:0;flex:1}#burger{display:none}.ctl{display:flex;gap:8px;align-items:center}#clock{color:var(--or);font-weight:700}
main{padding:20px}.btn{background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}.btn:hover{border-color:var(--or)}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.sm{padding:3px 8px;font-size:12px;margin-left:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;backdrop-filter:blur(10px);margin-bottom:14px}.scroll{overflow-x:auto}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}.bar h2{margin:0;font-size:18px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;text-transform:uppercase}

.srow{display:flex;gap:10px;align-items:center;margin-bottom:8px}.srow .badge{width:70px;text-align:center}.srow .pb{flex:1}
.tl{list-style:none;padding:0;margin:0;max-height:260px;overflow:auto}.tl li{padding:6px 0 6px 14px;border-left:2px solid var(--red);margin-left:4px;font-size:13px}.tl small{color:var(--mu);margin-right:6px}
.note{background:rgba(255,138,31,.12);border:1px solid var(--or);border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:14px}
.mapw{padding:0;overflow:hidden}canvas{display:block;max-width:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
dialog{background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:0;width:min(440px,94vw);max-height:90vh}dialog::backdrop{background:rgba(0,0,0,.6)}
.box{padding:18px;display:flex;flex-direction:column;gap:10px}.box label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit}.row{display:flex;gap:8px;justify-content:flex-end}.err{color:var(--red);margin:0;font-size:12px}
#toasts{position:fixed;right:14px;bottom:14px;z-index:99;display:flex;flex-direction:column;gap:8px}.toast{background:var(--ok);color:#fff;padding:10px 16px;border-radius:8px}.toast.bad{background:var(--red)}
.nw{white-space:nowrap}
@media(max-width:900px){aside{transform:translateX(-100%)}aside.open{transform:none}#main{margin-left:0}#burger{display:block}main{padding:12px}}
@media print{aside,header,.btn{display:none!important}#main{margin:0}body{background:#fff;color:#000}.card{border:1px solid #999;color:#000}}

d.incidents.forEach(i=>{if(i.team&&!d.teams.find(t=>t.id===i.team))i.team=0;if(i.status==='Responding'&&!i.team)i.status='Reported';if(i.status==='Reported'&&!i.team){i.wait=(i.wait||0)+1;if(i.wait%5===0)i.victims++}});
if(d.strategy!=='manual'){const q=d.incidents.filter(i=>i.status==='Reported'&&!i.team);if(d.strategy==='severity')q.sort((a,b)=>RX.SEV[b.sev]-RX.SEV[a.sev]);q.forEach(i=>{const av=d.teams.filter(t=>t.status==='Available').sort((a,b)=>RX.dist(a,i)-RX.dist(b,i));if(av.length)RX.assign(i.id,av[0].id)})}
d.teams.forEach(t=>{if(t.status!=='Deployed')return;t.busy=(t.busy||0)+1;const i=d.incidents.find(x=>x.id===t.incident);if(!i)return;const D=RX.dist(t,i);if(D>12){const f=Math.min(1,18/D);t.x+=(i.x-t.x)*f;t.y+=(i.y-t.y)*f}else{i.progress=Math.min(100,i.progress+[0,12,8,5,3][RX.SEV[i.sev]]*(.5+t.members/20));if(i.progress>=100){i.status='Resolved';i.resolvedAt=d.tick;RX.ih(i,'Resolved by '+t.name);const h=d.hospitals.filter(h=>h.occupied<h.beds).sort((a,b)=>RX.dist(a,i)-RX.dist(b,i))[0];if(h)h.occupied=Math.min(h.beds,h.occupied+Math.round(i.victims*.3));RX.log(`Incident #${i.id} resolved by ${t.name}`)}}});
d.zones.forEach(z=>{if(z.status!=='Evacuating')return;const s=d.shelters.find(x=>x.id===z.shelter);if(!s||s.status==='Closed')return;const n=Math.min(Math.ceil(z.pop*.06),z.pop-z.evacuated,s.capacity-s.occupied);if(n>0){z.evacuated+=n;s.occupied+=n;RX.use('Food',n*.2);RX.use('Water',n*.5)}if(z.evacuated>=z.pop){z.status='Complete';RX.log('Evacuation complete: '+z.name)}});
d.shelters.forEach(s=>{s.food=Math.max(0,s.food-s.occupied*.02);s.water=Math.max(0,s.water-s.occupied*.04)});
if(d.settings.random&&Math.random()<.05)RX.spawn(RX.TYPES[Math.floor(Math.random()*5)],1)};
RX.runBatch=st=>{const keep=RX.data;RX.data=RX.seed();const d=RX.data;d.strategy=st;d.zones.forEach(z=>z.status='Evacuating');let n=0;while(n++<300){RX.step();if(!d.incidents.some(i=>i.status!=='Resolved')&&!d.zones.some(z=>z.status==='Evacuating'))break}
const r={strategy:st,score:RX.score(d),resolved:d.incidents.filter(i=>i.status==='Resolved').length,resp:RX.avgResp(d).toFixed(1),ticks:d.tick};RX.data=keep;keep.runs.push(r)};
RX.reg('simulation','Scenario Evaluation','▶',el=>{const d=RX.data,best=Math.max(...d.runs.map(r=>r.score),-1e9);
el.innerHTML=`<div class="note">Runs the sample scenario headlessly under each dispatch strategy and compares simulated outcomes.</div><div class="card"><div class="box"><label>Live dispatch strategy<select id="st"><option value="manual">Manual (you assign teams)</option><option value="nearest">Auto – nearest team, first come</option><option value="severity">Auto – highest severity first</option></select></label><p>Tick T+${d.tick} · Score <b>${RX.score(d)}</b> · Use ▶ Start / ⏸ Pause / ↺ Restart in the top bar.</p><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn red" id="cmp">Compare all strategies</button><button class="btn" id="clr">Clear results</button></div></div></div><div class="card scroll"><table><tr><th>Strategy</th><th>Score</th><th>Resolved</th><th>Avg response (ticks)</th><th>Ticks used</th></tr>${d.runs.map(r=>`<tr style="${r.score===best?'color:var(--ok);font-weight:700':''}"><td>${r.strategy}</td><td>${r.score}</td><td>${r.resolved}/4</td><td>${r.resp}</td><td>${r.ticks}</td></tr>`).join('')||'<tr><td>No runs yet</td></tr>'}</table></div>`;
RX.$('#st').value=d.strategy;RX.$('#st').onchange=e=>{d.strategy=e.target.value;RX.save();RX.toast('Strategy: '+d.strategy)};
RX.$('#cmp').onclick=()=>{d.runs=[];['manual','nearest','severity'].forEach(RX.runBatch);RX.save();RX.toast('Comparison complete');RX.render()};
RX.$('#clr').onclick=()=>RX.confirm('Clear results?',()=>{d.runs=[];RX.save();RX.render()})});
</script><script>RX.bars=(id,labels,vals,color,max)=>{const cv=RX.$('#'+id);if(!cv)return;cv.width=cv.parentElement.clientWidth-28;cv.height=170;const c=cv.getContext('2d'),m=max||Math.max(1,...vals),w=cv.width/labels.length,tx=getComputedStyle(document.body).color;c.textAlign='center';c.font='11px sans-serif';vals.forEach((v,i)=>{const h=v/m*110;c.fillStyle=color;c.fillRect(i*w+w*.2,130-h,w*.6,h);c.fillStyle=tx;c.fillText(Math.round(v*10)/10,i*w+w/2,125-h);c.fillText(String(labels[i]).slice(0,11),i*w+w/2,150)})};
RX.reg('analytics','Analytics & Reports','▥',el=>{const d=RX.data,res=d.incidents.filter(i=>i.status==='Resolved').length;
el.innerHTML=`<div class="bar"><h2>Disaster Report (simulated)</h2><button class="btn red" id="pr">🖨 Print report</button></div><div class="kpis">${[['Avg response time',RX.avgResp(d).toFixed(1)+' ticks'],['Incidents resolved',res+'/'+d.incidents.length],['People evacuated',RX.sum(d.zones,z=>z.evacuated)],['Score',RX.score(d)]].map(k=>`<div class="card kpi or"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}</div><div class="grid2">${[['Incident trend by type','c1'],['Team utilization %','c2'],['Shelter occupancy %','c3'],['Resource consumption','c4']].map(c=>`<div class="card"><h3>${c[0]}</h3><canvas id="${c[1]}"></canvas></div>`).join('')}</div><div class="card scroll"><h3>Incident history</h3><table><tr><th>#</th><th>Title</th><th>Severity</th><th>Status</th><th>Response</th></tr>${d.incidents.map(i=>`<tr><td>${i.id}</td><td>${RX.h(i.title)}</td><td>${i.sev}</td><td>${i.status}</td><td>${i.respondedAt!=null?i.respondedAt-i.created+' ticks':'—'}</td></tr>`).join('')}</table></div><p class="note">All figures are simulated for education only.</p>`;
RX.$('#pr').onclick=()=>window.print();
const ty=[...RX.TYPES,'Custom'];RX.bars('c1',ty,ty.map(t=>d.incidents.filter(i=>i.type===t).length),'#e5392b');
RX.bars('c2',d.teams.map(t=>t.name),d.teams.map(t=>d.tick?Math.min(100,(t.busy||0)/d.tick*100):0),'#4da3ff',100);
RX.bars('c3',d.shelters.map(s=>s.name),d.shelters.map(s=>s.occupied/s.capacity*100),'#2fb86b',100);
RX.bars('c4',d.resources.map(r=>r.name),d.resources.map(r=>r.used||0),'#ff8a1f')});
</script>
<script>window.RX?RX.init():0</script></body></html>
